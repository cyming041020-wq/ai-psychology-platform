server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: psychology-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/psychology?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-32-byte-value}
    expiration: ${JWT_EXPIRATION:PT24H}
