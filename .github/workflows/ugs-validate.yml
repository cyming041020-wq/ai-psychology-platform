name: ugs-validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
      - 'build/**'
      - 'ci/**'
      - 'perf/**'
    tags:
      - 'v*.*.*'

jobs:
  governance:
    name: ugs-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository policy files
        run: scripts/validate_repo.sh

      - name: Validate commit messages
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/heads/* ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          scripts/validate_commit_range.sh "$range"

      - name: Validate formal release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/validate_tag_signature.sh "$(git rev-parse "$GITHUB_REF")"

  application:
    name: application-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        run: mvn -f backend/pom.xml clean test

      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Validate pull request body
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          for header in "## Summary" "## Motivation" "## Test Evidence" "## Risk" "## Rollback" "## Breaking Change" "## Backport Target"; do
            printf '%s\n' "$body" | grep -Fq "$header" || {
              echo "missing PR section: $header" >&2
              exit 1
            }
          done
